# kind config for cluster "b"
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Share the same host folder as cluster a, so the restore Job can read the dump
    extraMounts:
      - hostPath: /tmp/migrate-__SID__
        containerPath: /tmp/migrate-__SID__
    # Expose the app NodePort on the EC2 host (curl localhost:30081)
    extraPortMappings:
      - containerPort: 30081
        hostPort: 30081
