# kind config for cluster "a"
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Share a host folder with the node, so the dump file lands on the EC2 host
    extraMounts:
      - hostPath: /tmp/migrate-__SID__
        containerPath: /tmp/migrate-__SID__
    # Expose the app NodePort on the EC2 host (curl localhost:30080)
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
